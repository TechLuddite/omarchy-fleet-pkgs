name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare fixture builder
        run: docker build -t omarchy-build-isolation-test -f tests/build-isolation.Dockerfile tests
      - name: Verify isolated builds with real pacman transactions
        env:
          CONTAINER_ENGINE: docker
          TEST_BUILDER_IMAGE: omarchy-build-isolation-test
        run: tests/build-isolation.sh

  self-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # An Arch container for vercmp: version ordering has to be decided by
      # the same comparator pacman uses on users' machines.
      - name: Run self-tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm git jq
              ./bin/sync-upstream self-test
              ./bin/sync-rebuilds --self-test
              ./bin/omarchy-pkgs self-test
              ./bin/omarchy-release self-test
            '

  # Luddite Scout reads the checkout: agent instruction files, hidden Unicode,
  # Actions, dependencies and build-time code. It runs nothing from this
  # repository. Fails on any HIGH or MEDIUM finding that .scout-accepted.json
  # does not list with a reason, on a listed entry that no longer matches a
  # finding, and on a check that could not finish.
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: TechLuddite/luddite-scout-action@b34b6a811b70e99c51a8e9b1f4a1aeecc786d99d
        with:
          fail-on: medium
          accepted: .scout-accepted.json
          name: ${{ github.repository }}
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
